# Auxesis Capital → PocketBase on 127.0.0.1:8091
# Paste inside the existing <VirtualHost *:443> for students.iima.ac.in (next to the garba2026 block;
# find it with: sudo grep -ril "students.iima.ac.in" /etc/httpd/), then:
#
#   CentOS / RHEL (httpd):
#     httpd -M | grep -E 'proxy_module|proxy_http|headers'   # all three should be listed (they are by default)
#     getsebool httpd_can_network_connect                    # must be on; if off: sudo setsebool -P httpd_can_network_connect 1
#     sudo apachectl configtest && sudo systemctl reload httpd
#
#   Debian / Ubuntu (apache2):
#     sudo a2enmod proxy proxy_http headers && sudo apachectl configtest && sudo systemctl reload apache2
#
# One prefix serves everything: the site (/auxesiscapital/), the API (/auxesiscapital/api/),
# and the PocketBase dashboard (/auxesiscapital/_/). Apache strips /auxesiscapital before forwarding.

RedirectMatch 301 ^/auxesiscapital$ /auxesiscapital/

ProxyPass        /auxesiscapital/ http://127.0.0.1:8091/ timeout=120
ProxyPassReverse /auxesiscapital/ http://127.0.0.1:8091/

<Location /auxesiscapital/>
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Prefix "/auxesiscapital"
</Location>
